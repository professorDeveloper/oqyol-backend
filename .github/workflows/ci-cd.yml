name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  # ── CI: install, generate Prisma client, smoke-test the app wiring ────────
  ci:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # prisma.config.js reads DATABASE_URL; a dummy value is enough for `generate`.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Smoke test (load app + mount all routes)
        run: |
          node --input-type=module -e "import('./src/app.js').then(m => { m.createApp(); console.log('App boots OK'); }).catch(e => { console.error(e); process.exit(1); });"
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          JWT_ACCESS_SECRET: ci_access_secret_0123456789
          JWT_REFRESH_SECRET: ci_refresh_secret_0123456789
          JWT_REGISTER_SECRET: ci_register_secret_0123456789

  # ── CD: deploy to the production droplet on every push to master ──────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      # Skip (don't fail) the deploy until SSH secrets are configured.
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_HOST secret is not set — skipping deploy. Add SSH_HOST/SSH_USER/SSH_PRIVATE_KEY/DEPLOY_PATH to enable auto-deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin master
            docker compose up -d --build
            # Sync schema to DB (additive; project uses `prisma db push`, not migrations)
            docker compose exec -T api npx prisma db push
            docker image prune -f
