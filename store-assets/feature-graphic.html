<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  .canvas{
    position:relative;width:1024px;height:500px;
    background:
      radial-gradient(720px 520px at 78% 18%, rgba(34,197,94,.20), transparent 60%),
      radial-gradient(680px 600px at 8% 95%, rgba(59,130,246,.26), transparent 58%),
      linear-gradient(135deg,#0a1426 0%,#0d1f3d 45%,#0c2b3f 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;overflow:hidden;
  }
  /* subtle dot grid */
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1.4px,transparent 1.4px);background-size:26px 26px;opacity:.6}

  .left{position:absolute;left:72px;top:0;height:500px;display:flex;flex-direction:column;justify-content:center;width:560px;z-index:3}
  .logo-row{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .logo{width:92px;height:92px;border-radius:22px;background:linear-gradient(135deg,#3b82f6,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:54px;color:#fff;box-shadow:0 18px 40px -12px rgba(59,130,246,.7)}
  .word{font-size:62px;font-weight:800;letter-spacing:-1px}
  .tagline{font-size:27px;font-weight:600;line-height:1.32;color:#e7eefc;max-width:520px;margin-bottom:24px}
  .tagline .accent{background:linear-gradient(120deg,#7dd3fc,#86efac);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .pills{display:flex;gap:12px}
  .pill{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:18px;font-weight:600;color:#eaf1ff}
  .pill .ic{width:19px;height:19px;stroke:#86efac;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .pill.b .ic{stroke:#7dd3fc}

  /* right illustration */
  .scene{position:absolute;right:0;top:0;width:470px;height:500px;z-index:2}
  .scene svg{position:absolute;right:34px;top:50%;transform:translateY(-50%)}
  .glow{position:absolute;right:90px;top:50%;transform:translateY(-50%);width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.30),transparent 65%);filter:blur(8px)}
</style>
</head>
<body>
<div class="canvas">
  <div class="dots"></div>
  <div class="glow"></div>

  <div class="scene">
    <svg width="392" height="392" viewBox="0 0 392 392" fill="none">
      <!-- route card -->
      <rect x="40" y="58" width="312" height="276" rx="28" fill="#0f2747" stroke="rgba(255,255,255,.10)"/>
      <!-- dashed curved route -->
      <path d="M96 132 C 150 132, 150 232, 230 232 S 300 268, 300 268" stroke="url(#g1)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
      <!-- start pin -->
      <g transform="translate(78,108)">
        <circle cx="18" cy="18" r="17" fill="#3b82f6"/>
        <circle cx="18" cy="18" r="6.5" fill="#fff"/>
      </g>
      <!-- end pin -->
      <g transform="translate(282,238)">
        <path d="M18 2c8.8 0 16 7.2 16 16 0 11-16 24-16 24S2 29 2 18C2 9.2 9.2 2 18 2Z" fill="#22c55e"/>
        <circle cx="18" cy="18" r="6" fill="#06210f"/>
      </g>
      <!-- car -->
      <g transform="translate(150,176)">
        <rect x="-6" y="6" width="104" height="40" rx="14" fill="#eef4ff"/>
        <path d="M14 6 C18 -8 78 -8 82 6" fill="none" stroke="#eef4ff" stroke-width="13" stroke-linecap="round"/>
        <circle cx="20" cy="48" r="11" fill="#0b1426" stroke="#cfe0ff" stroke-width="4"/>
        <circle cx="76" cy="48" r="11" fill="#0b1426" stroke="#cfe0ff" stroke-width="4"/>
        <rect x="2" y="14" width="92" height="3" rx="1.5" fill="#9bc0ff"/>
      </g>
      <defs>
        <linearGradient id="g1" x1="96" y1="132" x2="300" y2="268" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22c55e"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="left">
    <div class="logo-row">
      <div class="logo">O</div>
      <div class="word">Oqyol</div>
    </div>
    <div class="tagline">Shaharlararo va shahar ichi safarlar —<br><span class="accent">tez, qulay va ishonchli</span></div>
    <div class="pills">
      <span class="pill b"><svg class="ic" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Yo‘lovchi</span>
      <span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9L2.1 10.7C1.4 11.3 1 12.1 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg> Haydovchi</span>
    </div>
  </div>
</div>
</body>
</html>
